# ============================================================================
# ScamGuard parent-PC configuration - TEMPLATE
# ============================================================================
# 1. Copy this file to  config.ini  in the same folder as the scripts
#    (normally C:\ScamGuard).
# 2. Fill in ENDPOINT_URL below.
# 3. Treat config.ini like a password: never share the ENDPOINT_URL, never
#    commit config.ini to a repository (it is gitignored here), never paste
#    it into chats or screenshots. Anyone who has the URL can post to your
#    review sheet and send you email.
#
# Format: KEY=VALUE, one per line. Lines starting with # are comments.

# REQUIRED. The Google Apps Script web app URL that receives the screenshots.
# You copied it in appsscript/SETUP.md, step 6 - it is the deployment URL
# ending in /exec.
ENDPOINT_URL=https://script.google.com/macros/s/PASTE-YOUR-DEPLOYMENT-ID/exec

# Optional. Friendly name for this computer, shown in the dashboard and in
# the notification email so you know whose screen you are looking at.
# Leave empty to use the Windows computer name.
DEVICE_NAME=Mom's PC

# Optional but recommended. Shared key the Apps Script checks before
# accepting an upload. Set SECRET_KEY in appsscript/Code.gs to a long random
# string, redeploy, and paste the exact same string here. Leave empty only
# if you also left it empty in Code.gs.
SECRET_KEY=

# Optional. Which key sends a screenshot. Default: PrintScreen.
# Many compact and laptop keyboards have no PrintScreen key - pick anything
# AutoHotkey understands, and something that will not be pressed by accident:
#     HOTKEY=PrintScreen
#     HOTKEY=F12
#     HOTKEY=ScrollLock
#     HOTKEY=Pause
#     HOTKEY=^!s          Ctrl+Alt+S     ( ^=Ctrl  !=Alt  +=Shift  #=Win )
#     HOTKEY=^!h          Ctrl+Alt+H
# Whichever you choose, put the red sticker on that key.
HOTKEY=PrintScreen

# Optional. How often, in seconds, this PC asks the endpoint whether you have
# marked one of its screenshots as a scam. When you mark one, a large red
# warning appears on the parent's screen telling her to stop, in whatever
# words you typed. Marking something SAFE shows her nothing at all.
# Default: 45, so she is warned within about a minute of you tapping "Scam".
#     POLL_SECONDS=45     the default
#     POLL_SECONDS=15     warns her sooner, but talks to Google three times
#                         as often - each check uses a little of the free
#                         Apps Script quota, so do not go lower without reason
#     POLL_SECONDS=0      turns the on-screen warning off completely; the
#                         red key still sends screenshots as normal
# Anything under 5 is treated as 5. Anything that is not a number turns the
# warning off, the same as 0.
POLL_SECONDS=45
