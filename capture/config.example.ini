# ============================================================================
# ScamGuard parent-PC configuration - TEMPLATE
# ============================================================================
# 1. Copy this file to  config.ini  in the same folder as the scripts
#    (normally C:\ScamGuard).
# 2. Fill in ENDPOINT_URL below.
# 3. Treat config.ini like a password: never share the ENDPOINT_URL, never
#    commit config.ini to a repository (it is gitignored here), never paste
#    it into chats or screenshots. Anyone who has the URL can post to your
#    review sheet and send you email.
#
# Format: KEY=VALUE, one per line. Lines starting with # are comments.

# REQUIRED. The Google Apps Script web app URL that receives the screenshots.
# You copied it in appsscript/SETUP.md, step 6 - it is the deployment URL
# ending in /exec.
ENDPOINT_URL=https://script.google.com/macros/s/PASTE-YOUR-DEPLOYMENT-ID/exec

# Optional. Friendly name for this computer, shown in the dashboard and in
# the notification email so you know whose screen you are looking at.
# Leave empty to use the Windows computer name.
DEVICE_NAME=Mom's PC

# Optional but recommended. Shared key the Apps Script checks before
# accepting an upload. Set SECRET_KEY in appsscript/Code.gs to a long random
# string, redeploy, and paste the exact same string here. Leave empty only
# if you also left it empty in Code.gs.
SECRET_KEY=
